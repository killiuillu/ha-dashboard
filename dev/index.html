<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>evcc-Dashboard – Dev</title>
  <script src="../dist/ha-dashboard.js"></script>
  <link rel="stylesheet" href="vendor/mdi/materialdesignicons.min.css" />
  <script>
    if (!customElements.get("ha-icon")) {
      customElements.define("ha-icon", class extends HTMLElement {
        connectedCallback() {
          const icon = (this.getAttribute("icon") || "").replace(/^mdi:/, "");
          this.innerHTML = `<i class="mdi mdi-${icon}" style="font-size:var(--mdc-icon-size,24px);display:inline-block"></i>`;
        }
      });
    }
  </script>
  <style>
    :root {
      --primary-text-color: #212121;
      --secondary-text-color: #727272;
      --card-background-color: #ffffff;
      --ha-card-background: #ffffff;
      --divider-color: rgba(127,127,127,.2);
      --primary-background-color: #f5f5f5;
    }
    body { margin: 0; padding: 24px; font-family: var(--font-family, system-ui, sans-serif); background: var(--primary-background-color, #f5f5f5); color: var(--primary-text-color, #212121); }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    h2 { font-size: 1.05rem; margin: 28px 0 10px; }
    .sub { color: var(--secondary-text-color, #727272); margin-bottom: 16px; }
    .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
    .swatch { width: 110px; border-radius: 12px; overflow: hidden; background: var(--ha-card-background, #fff); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .swatch .c { height: 56px; }
    .swatch .n { padding: 6px 8px; font-size: .72rem; font-weight: 600; }
    .type { background: var(--ha-card-background, #fff); border-radius: 28px; padding: 20px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
    .note { color: var(--secondary-text-color, #727272); font-size: .85rem; }
  </style>
</head>
<body>
  <h1>evcc-Dashboard <span class="note" id="ver"></span></h1>
  <div class="sub">Lokaler HA-Test (Mock-<code>hass</code>) – Karten im Stil von Raumklima 2, nur Anzeige.</div>

  <h2>Status-Farben (Ampel)</h2>
  <div class="swatches" id="swatches"></div>

  <h2>Typografie</h2>
  <div class="type">
    <div class="now" style="font-size:2.9rem;font-weight:300;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums">2.250 <small>W</small></div>
    <div style="margin-top:8px;color:var(--secondary-text-color,#727272);font-size:.82rem">Hausverbrauch · Chip-Stil · .stat-Label-Stil</div>
    <div style="margin-top:10px"><span class="chip-demo" style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:.82rem;font-weight:600;color:var(--evc-color-status-ok);background:color-mix(in srgb, var(--evc-color-status-ok) 14%, transparent)">PV erzeugt</span></div>
  </div>

  <h2>Karten</h2>
  <div class="cards" id="cards"></div>
  <p class="note" id="nocards">Noch keine Karten registriert.</p>

  <h2>Dashboard-Strategie (ll-strategy-dashboard-evcc)</h2>
  <pre id="strategy" class="type" style="overflow:auto;max-height:320px;font-size:.75rem"></pre>

  <script type="module">
    import { buildApi, callApiMock } from "./mock-api.mjs";
    const fixture = await (await fetch("fixture.json")).json();
    const api = buildApi(new Date());
    const lang = new URLSearchParams(location.search).get("lang") || "de";
    window.__hass = {
      states: fixture.states,
      entities: fixture.entities || {},
      areas: fixture.areas || {},
      devices: fixture.devices || {},
      language: lang,
      locale: { language: lang, number_format: "language" },
      user: { is_admin: true, name: "Test" },
      themes: { darkMode: false },
      callWS: async (msg) => (msg.type in (fixture.ws || {}) ? structuredClone(fixture.ws[msg.type]) : {}),
      callApi: callApiMock(api),
      callService: async () => ({}),
      connection: { subscribeMessage: async () => () => {} },
      formatEntityState: (s) => s.state,
    };

    document.getElementById("ver").textContent = "v" + (window.evccDashboard?.version || "?");

    const tokens = await (await fetch("../src/tokens/design-tokens.json")).json();
    const sw = document.getElementById("swatches");
    for (const [name, hex] of Object.entries(tokens.colors.status)) {
      const d = document.createElement("div");
      d.className = "swatch";
      d.innerHTML = `<div class="c" style="background:${hex}"></div><div class="n">${name}<br>${hex}</div>`;
      sw.appendChild(d);
    }

    const demoConfigs = {
      "custom:evcc-overview-card": {
        title: "evcc",
        entities: {
          pv_power: "sensor.evcc_pv_power",
          grid_power: "sensor.evcc_grid_power",
          home_power: "sensor.evcc_home_power",
          battery_soc: "sensor.evcc_battery_soc",
          battery_power: "sensor.evcc_battery_power",
        },
      },
      "custom:evcc-loadpoint-card": {
        title: "Ladepunkt 1",
        entities: {
          charge_power: "sensor.evcc_loadpoint_1_charge_power",
          vehicle_soc: "sensor.evcc_loadpoint_1_vehicle_soc",
          status: "sensor.evcc_loadpoint_1_status",
        },
      },
      "custom:evcc-history-card": {
        title: "Verlauf heute",
        entities: {
          pv_power: "sensor.evcc_pv_power",
          grid_power: "sensor.evcc_grid_power",
          home_power: "sensor.evcc_home_power",
        },
      },
      "custom:evcc-vehicle-card": {
        title: "Mein Auto",
        entities: {
          vehicle_soc: "sensor.evcc_loadpoint_1_vehicle_soc",
          range: "sensor.evcc_loadpoint_1_vehicle_range",
          charge_power: "sensor.evcc_loadpoint_1_charge_power",
          status: "sensor.evcc_loadpoint_1_status",
        },
      },
      "custom:evcc-energy-card": {
        title: "Energie & Kosten",
        entities: {
          pv_today: "sensor.evcc_pv_today",
          grid_import_today: "sensor.evcc_grid_import_today",
          grid_export_today: "sensor.evcc_grid_export_today",
          home_today: "sensor.evcc_home_today",
          price: "sensor.evcc_price",
        },
      },
      "custom:modular-calendar-card": {
        title: "Kalender",
        entities: ["calendar.familie", "calendar.arbeit"],
        view: "list",
        days: 14,
      },
      "custom:modular-rooms-card": { title: "Räume", control: true },
      "custom:modular-ticker-card": { title: "Ereignisse" },
      "custom:modular-lights-card": {
        title: "Lichter",
        entities: ["light.wohnzimmer", "light.kueche"],
      },
      "custom:modular-waste-card": {
        title: "Mülltonnen",
        entities: [
          "sensor.waste_collection_schedule_restmuell",
          "sensor.waste_collection_schedule_bio",
          "sensor.waste_collection_schedule_papier",
          "sensor.waste_collection_schedule_gelbe_tonne",
        ],
      },
    };

    const cards = document.getElementById("cards");
    const registered = (window.customCards || []).filter(
      (c) => c.type.startsWith("custom:evcc-") || c.type.startsWith("custom:modular-"),
    );
    if (registered.length) document.getElementById("nocards").style.display = "none";

    const strat = document.createElement("ll-strategy-dashboard-evcc");
    const dash = await strat.constructor.generate({ prefix: "evcc" }, window.__hass);
    document.getElementById("strategy").textContent = JSON.stringify(dash, null, 2);
    for (const c of registered) {
      const el = document.createElement(c.type.replace("custom:", ""));
      el.setConfig(demoConfigs[c.type] || {});
      el.hass = window.__hass;
      cards.appendChild(el);
    }
  </script>
</body>
</html>
