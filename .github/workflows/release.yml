name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: gzip -k -f dist/ha-dashboard.js
      - name: GitHub-Release mit Bundle erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hacs.json
            dist/ha-dashboard.js
            dist/ha-dashboard.js.gz
